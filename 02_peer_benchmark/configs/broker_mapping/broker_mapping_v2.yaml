schema_version: 1
mapping_version: "v2"
status: "approved"
scope: "concentration_classification_and_synthetic_regression"
decision_authority: "docs/DECISIONS.md"

change_control:
  change_reason: "发布集中度分类逐券商精确危险档映射，并保留 v1 合成回归映射"
  previous: "broker_mapping_v1.yaml"
  new:
    - "按 D-054 为宽表中已声明枚举的15家券商逐原值建立精确映射"
    - "按 D-051 将未映射非空值的动作冻结为 UNKNOWN、排除该记录指标并审计"
    - "保留两家完全合成券商映射，保证既有黄金案例可复现"
  effective_date: "2026-08-07"
  approved_by: "规则维护者"
  supersedes: "broker_mapping_v1.yaml"

inference_policy:
  infer_from_alphabetical_order: false
  infer_from_numeric_order: false
  infer_from_text_meaning: false
  infer_from_regular_expression: false
  infer_from_other_broker_mapping: false
  require_exact_broker_and_raw_code_match: true
  decision_ids: ["D-005", "D-054"]

unknown_value_policy:
  action: "EXCLUDE_RECORD_AS_UNKNOWN_WITH_AUDIT"
  normalized_value: "UNKNOWN"
  block_entire_task: false
  decision_id: "D-051"

blank_value_policy:
  st_status_missing: "UNKNOWN_EXCLUDE_WITH_AUDIT"
  st_or_star_st: "DANGEROUS_ST_OVERRIDE"
  non_st: "NON_DANGEROUS_GENERAL_STOCK"
  decision_id: "D-051"

