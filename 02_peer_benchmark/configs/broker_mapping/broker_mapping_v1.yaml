# 下列券商名和代码完全虚构，仅用于证明“逐券商、逐原始值显式映射”的配置形式。
brokers:
  SYNTH_BROKER_ORCHID:
    source_kind: "synthetic"
    mappings:
      ORCHID_CLEAR: "NON_DANGEROUS"
      ORCHID_WATCH: "NON_DANGEROUS"
      ORCHID_BLOCK: "DANGEROUS"
      ORCHID_RESTRICTED: "DANGEROUS"

  SYNTH_BROKER_CEDAR:
    source_kind: "synthetic"
    mappings:
      CEDAR_GREEN: "NON_DANGEROUS"
      CEDAR_AMBER: "DANGEROUS"
      CEDAR_RED: "DANGEROUS"

allowed_normalized_values:
  - "DANGEROUS"
  - "NON_DANGEROUS"
